<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bat — ضد الوحدة والوسواس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8e8e8;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.7;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; }
    .subtitle { text-align: center; opacity: 0.8; margin-bottom: 30px; }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h2 { margin-bottom: 16px; color: #7fdbff; font-size: 1.3rem; }
    button {
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin: 6px 4px;
      transition: transform 0.15s;
    }
    button:hover { transform: scale(1.05); }
    button.secondary { background: #e94560; color: white; }
    .timer { font-size: 3rem; text-align: center; margin: 20px 0; font-weight: bold; }
    .breath-circle {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: #4ecca3;
      margin: 20px auto;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #1a1a2e;
      transition: transform 4s ease-in-out;
    }
    .prompt-box {
      background: rgba(0,0,0,0.3);
      padding: 16px;
      border-radius: 10px;
      margin-top: 12px;
      min-height: 60px;
    }
    a { color: #7fdbff; }
    .crisis { background: rgba(233,69,96,0.2); border-color: #e94560; }
    ul { padding-right: 20px; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Bat
